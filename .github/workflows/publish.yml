# Publishes every shellcell package repository to dl.shellcell.dev.
#
# main holds desired state: snailmail.toml, the locks, the publication ledgers
# and deployment receipts. gh-pages holds the built site, force-pushed as a
# single orphan commit so the published bytes never accumulate in history.
#
# Artifact bytes are in neither branch. Each lock pins an origin on the
# producing repository's GitHub Release, and snailmail refetches from it and
# checks it against the committed digest, so a fresh runner can rebuild every
# repository without any object storage.
name: publish

on:
  # A tool's release workflow dispatches this after publishing its assets.
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      repository:
        description: Tool repository to adopt from, as owner/name
        required: false
        type: string
      tag:
        description: Release tag to adopt, such as v0.1.2
        required: false
        type: string
      pin_downloads:
        description: >-
          Adopt packages the release publishes no digest for, pinning the bytes
          this run downloads instead. A weaker claim about what was released,
          so it is never the default and never available to an automatic
          dispatch — someone chooses it.
        required: false
        default: false
        type: boolean
  # Republish after a lock is changed by hand: promote, yank or prune.
  push:
    branches: [main]

permissions:
  contents: read

# Publishing rebuilds shared state, so a second run waits rather than racing the
# lock, the ledger and the branch.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          # Publication ledgers are validated against reachable history.
          fetch-depth: 0

      # Installed from the release asset, not `go install`.
      #
      # proxy.golang.org caches a module version's bytes on first fetch and
      # serves them forever, so a tag that moves after publication keeps
      # resolving to the code it originally pointed at. Release assets carry no
      # such history: they are the artifacts this workspace already adopts and
      # distributes, so the tool that publishes them is the tool being published.
      #
      # SHA256SUMS from the same release is the pin, which is the trust this
      # workspace already places in it through bin/adopt-release.sh.
      - name: Install snailmail
        env:
          SNAILMAIL_VERSION: v0.1.3
        run: |
          set -euo pipefail
          version=${SNAILMAIL_VERSION#v}
          asset="snailmail_${version}_linux_amd64.tar.gz"
          download="https://github.com/shellcell/snailmail/releases/download/${SNAILMAIL_VERSION}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --max-time 300 --remote-name-all \
            "${download}/${asset}" "${download}/SHA256SUMS"
          grep -F "  ./${asset}" SHA256SUMS | sed "s|\./||" | sha256sum -c -
          tar -xzf "$asset" snailmail
          install -m 0755 snailmail /usr/local/bin/snailmail
          rm -f "$asset" SHA256SUMS snailmail
          snailmail version

      - name: Adopt the release
        env:
          TOOL_REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
          TOOL_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          PIN_DOWNLOADS: ${{ inputs.pin_downloads }}
          # Raises the anonymous API rate limit when listing the release's
          # assets. Read-only, and on this repository only.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${TOOL_REPOSITORY}" ] || [ -z "${TOOL_TAG}" ]; then
            echo "no release to adopt; republishing current desired state"
            exit 0
          fi
          pin=()
          if [ "${PIN_DOWNLOADS}" = "true" ]; then
            pin=(--pin-downloads)
          fi
          bin/adopt-release.sh ${pin[@]+"${pin[@]}"} "${TOOL_REPOSITORY}" "${TOOL_TAG}"

      - name: Commit desired state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snailmail.toml repos
          if git diff --cached --quiet; then
            echo "desired state unchanged"
          else
            git commit -m "adopt ${TOOL_REPOSITORY:-release} ${TOOL_TAG:-}"
          fi
        env:
          TOOL_REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
          TOOL_TAG: ${{ github.event.client_payload.tag || inputs.tag }}

      # Signed repositories need their private keys on the runner. There is one
      # per signing scheme: apt and yum verify the same OpenPGP key, while apk
      # verifies a bare RSA key it holds by filename and can check no other.
      #
      # The passphrase goes in a file rather than the environment so it is not
      # visible to every later step or to anything inspecting the process. One
      # passphrase covers the store, so both keys share it.
      - name: Prepare the signing keys
        env:
          OPENPGP_KEY_REF: ${{ vars.SNAILMAIL_SIGNING_KEY_REF }}
          OPENPGP_PRIVATE_KEY: ${{ secrets.SNAILMAIL_SIGNING_PRIVATE_KEY }}
          APK_KEY_REF: ${{ vars.SNAILMAIL_APK_KEY_REF }}
          APK_PRIVATE_KEY: ${{ secrets.SNAILMAIL_APK_PRIVATE_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SNAILMAIL_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          store="${HOME}/.local/share/snailmail/private-keys"
          install_key() {
            reference=$1
            material=$2
            label=$3
            if [ -z "${reference}" ] || [ -z "${material}" ]; then
              echo "::error::${label} is signed but its key is not configured"
              exit 1
            fi
            case "${reference}" in
              *..*|/*|*\\*) echo "::error::unsafe ${label} key reference"; exit 1 ;;
            esac
            mkdir -p "${store}/$(dirname "${reference}")"
            install -m 600 /dev/null "${store}/${reference}.asc"
            printf '%s' "${material}" > "${store}/${reference}.asc"
          }
          install_key "${OPENPGP_KEY_REF}" "${OPENPGP_PRIVATE_KEY}" "the apt and yum repositories"
          install_key "${APK_KEY_REF}" "${APK_PRIVATE_KEY}" "the alpine repository"
          install -m 600 /dev/null "${RUNNER_TEMP}/snailmail-passphrase"
          printf '%s' "${SIGNING_PASSPHRASE}" > "${RUNNER_TEMP}/snailmail-passphrase"

      # plan refetches any artifact this runner does not have from the origin
      # its lock records, verifying each against the committed digest.
      - name: Plan
        env:
          SNAILMAIL_KEY_PASSPHRASE_FILE: ${{ runner.temp }}/snailmail-passphrase
        run: snailmail plan --out snailmail.snailmail-plan.json

      # The apt repository declares arm64, and this runner is amd64. Verifying
      # it means executing an arm64 container, which the kernel refuses without
      # binfmt_misc handlers. Ubuntu's own packages register them, so no
      # third-party image or action is needed.
      #
      # Removing this is not free: it would not skip the arm64 check, it would
      # fail the publish. Narrow the repository's architectures instead if you
      # no longer want arm64 verified.
      - name: Register emulation for foreign architectures
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support
          # Prove the handlers are live before relying on them.
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64
          docker run --rm --platform linux/arm64 \
            debian@sha256:9b67294679b30e5d6ab257b40594feeb4a4b81f7fcf4131f4decf0d6a212a9b0 \
            dpkg --print-architecture

      # --runner docker so each repository is checked by a real client
      # installing from the built tree, not only parsed.
      #
      # --image-registry because Docker Hub rate-limits anonymous pulls by
      # source address and hosted runners share them, so a publication can fail
      # for a reason that has nothing to do with its packages. Every
      # verification image is digest-pinned, so a mirror serves the same bytes
      # and the pin is unchanged — this picks a different route to them, not
      # different images. Set the VERIFICATION_IMAGE_REGISTRY variable to use
      # another mirror, or to docker.io to go back to pulling from there.
      - name: Apply
        env:
          SNAILMAIL_KEY_PASSPHRASE_FILE: ${{ runner.temp }}/snailmail-passphrase
          IMAGE_REGISTRY: ${{ vars.VERIFICATION_IMAGE_REGISTRY || 'mirror.gcr.io' }}
        run: |
          set -euo pipefail
          snailmail apply --plan snailmail.snailmail-plan.json --runner docker \
              --image-registry "${IMAGE_REGISTRY}"

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf site && mkdir -p site
          # Each published repository is a symlink to its current managed
          # release, so the copy dereferences: Git stores a symlink as a symlink
          # and Pages would serve it as a text file rather than following it.
          # The glob also skips snailmail's control and staging directories,
          # which are dot-prefixed and must not reach the site.
          for repository in docs/*/; do
              name=$(basename "$repository")
              cp -RL "$repository" "site/$name"
          done
          # Owning the apex of the subdomain, so the CNAME lives at the root.
          echo "dl.shellcell.dev" > site/CNAME
          # Pages runs Jekyll by default, which would drop files beginning with
          # an underscore and rewrite others.
          touch site/.nojekyll
          # The landing page is generated from the locks, so the versions it
          # advertises cannot drift from the ones actually published.
          snailmail site --output site/index.html \
              --title "shellcell packages" \
              --description "Signed package repositories for the shellcell tools."
          find site -maxdepth 2 | sort | head -40

      - name: Deploy the site
        run: |
          set -euo pipefail
          # An orphan commit each time: the site is a snapshot, and keeping its
          # history would mean keeping every artifact ever published.
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "publish ${GITHUB_SHA}"
          git push --force --quiet \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Ledgers and receipts are written by apply, so desired state and the
      # record of what happened are pushed together after it.
      - name: Push the publication record
        run: |
          set -euo pipefail
          # Neither directory exists until the first apply has written one.
          git add --all -- publications deployments 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "record publication ${GITHUB_SHA}"
          fi
          git push origin HEAD:main
